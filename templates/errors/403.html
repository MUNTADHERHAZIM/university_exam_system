{% extends "base.html" %}

{% block title %}غير مصرح لك بالوصول{% endblock %}

{% block extra_css %}
<style>
    .error-container {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 20px;
    }

    .error-card {
        background: var(--bg-main);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 60px 40px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        transition: all 0.3s ease;
    }

    [data-theme="dark"] .error-card {
        box-shadow: 0 10px 40px -10px rgba(0,0,0,0.4);
    }

    .error-icon {
        width: 120px;
        height: 120px;
        margin: 0 auto 30px;
        background: rgba(239, 68, 68, 0.08);
        border-radius: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ef4444;
        animation: pulse-red 2s infinite;
    }

    @keyframes pulse-red {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.2); }
        70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .error-title {
        font-size: 32px;
        font-weight: 900;
        margin-bottom: 16px;
        color: var(--fg-main);
    }

    .error-text {
        font-size: 18px;
        color: var(--fg-muted);
        line-height: 1.8;
        margin-bottom: 35px;
    }

    .error-actions {
        display: flex;
        gap: 15px;
        justify-content: center;
    }

    .btn-premium {
        background: var(--primary);
        color: white;
        padding: 14px 30px;
        border-radius: 12px;
        font-weight: 700;
        text-decoration: none;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }

    .btn-premium:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
        color: white;
    }

    .btn-outline {
        background: transparent;
        color: var(--fg-main);
        padding: 14px 30px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-weight: 700;
        text-decoration: none;
        transition: all 0.2s ease;
    }

    .btn-outline:hover {
        background: var(--bg-sub);
        border-color: var(--fg-main);
    }
</style>
{% endblock %}
